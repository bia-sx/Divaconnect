<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - ElasPodem</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/login.css">
    <link rel="stylesheet" href="../assets/css/darkmode-universal.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-brand-side">
            <div class="brand-content">
                
                <div class="brand-logo">
                    <div class="logo-circle">
                        <svg viewBox="0 0 100 100" class="heart-svg">
                            <path d="M50 85 L20 55 Q15 45 20 35 Q25 25 35 25 Q45 25 50 35 Q55 25 65 25 Q75 25 80 35 Q85 45 80 55 Z" fill="white"/>
                        </svg>
                    </div>
                    <h1 class="brand-title">
                        Elas<span class="brand-highlight">Podem</span>
                    </h1>
                </div>

                <div class="brand-tagline">
                    <p>Conectando mulheres através de serviços com segurança e confiança</p>
                </div>

                <div class="brand-stats">
                    <div class="stat-item">
                        <span class="stat-number">2.500+</span>
                        <span class="stat-label">Usuárias</span>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat-item">
                        <span class="stat-number">98%</span>
                        <span class="stat-label">Satisfação</span>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat-item">
                        <span class="stat-number">10k+</span>
                        <span class="stat-label">Conexões</span>
                    </div>
                </div>

                <div class="brand-features">
                    <div class="feature-chip">100% Seguro</div>
                    <div class="feature-chip">Só Mulheres</div>
                    <div class="feature-chip">Rápido</div>
                </div>
            </div>
        </div>

        <div class="login-form-side">
            <a href="../index.html" class="back-link">
                ← Voltar para início
            </a>

            <div class="form-wrapper">
                <div class="form-header">
                    <h2 class="form-title">Bem-vinda de volta!</h2>
                </div>

                <form id="loginForm" class="modern-form">
                    <div id="messageContainer"></div>

                    <div class="input-group">
                        <label for="email" class="input-label">
                            <span class="label-text">Email</span>
                            <span class="label-required">*</span>
                        </label>
                        <div class="input-wrapper">
                            <span class="input-icon"></span>
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                class="modern-input" 
                                placeholder="seu@email.com"
                                required
                                autocomplete="email"
                            >
                        </div>
                        <span class="input-error" id="emailError"></span>
                    </div>

                    <div class="input-group">
                        <label for="senha" class="input-label">
                            <span class="label-text">Senha</span>
                            <span class="label-required">*</span>
                        </label>
                        <div class="input-wrapper">
                            <span class="input-icon"></span>
                            <input 
                                type="password" 
                                id="senha" 
                                name="senha" 
                                class="modern-input" 
                                placeholder="••••••••"
                                required
                                autocomplete="current-password"
                            >
                            <button type="button" class="toggle-visibility" id="togglePassword">
                                <span class="eye-icon">👁️</span>
                            </button>
                        </div>
                        <span class="input-error" id="senhaError"></span>
                    </div>

                    <div class="form-options">
                        <label class="custom-checkbox">
                            <input type="checkbox" id="lembrar">
                            <span class="checkbox-mark"></span>
                            <span class="checkbox-label">Manter conectada</span>
                        </label>
                        <a href="#" class="link-secondary">Esqueceu a senha?</a>
                    </div>

                    <button type="submit" class="submit-button" id="btnSubmit">
                        <span class="button-content" id="btnText">
                            <span class="button-icon">→</span>
                            <span>Entrar</span>
                        </span>
                        <span class="button-loader" id="btnLoader"></span>
                    </button>
                </form>

                <div class="form-footer">
                    <div class="divider">
                        <span class="divider-text">Ainda não tem conta?</span>
                    </div>
                    <a href="cadastro.html" class="link-create-account">
                        Criar conta gratuita
                        <span class="link-arrow">→</span>
                    </a>
                </div>
            </div>

            <div class="security-badge">
                <span class="badge-icon">🔐</span>
                <span class="badge-text">Suas informações estão protegidas</span>
            </div>
        </div>
    </div>

    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/darkmode-universal.js"></script>
</body>
</html>
